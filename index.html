
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive — Acervo Visual</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101010;
  color: #e8e4e1;
  font-family: Georgia, serif;
}

header {
  padding: 35px 6%;
  border-bottom: 1px solid #333;
}

h1 {
  font-size: 32px;
  letter-spacing: 5px;
  margin: 0 0 10px;
}

header p {
  color: #999;
  font-size: 14px;
}

nav {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  padding: 20px 6%;
}

nav button {
  background: none;
  border: 1px solid #444;
  color: #ddd;
  padding: 9px 13px;
  cursor: pointer;
}

nav button:hover {
  background: #572d3b;
}

.gallery {
  padding: 0 6% 40px;
  columns: 2;
  column-gap: 12px;
}

.item {
  margin-bottom: 12px;
  break-inside: avoid;
  cursor: pointer;
}

.item img {
  display: block;
  width: 100%;
  border-radius: 3px;
  transition: opacity .2s;
}

.item img:hover { opacity: .75; }

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  background: #000e;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

#viewer img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
}

#close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 30px;
  color: white;
  background: none;
  border: none;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 12px;
}

@media (min-width: 700px) {
  .gallery { columns: 4; }
}
</style>
</head>

<body>
<header>
  <h1>ARCHIVE.</h1>
  <p>an archive of images, games and other worlds.</p>
</header>

<nav>
  <button onclick="filter('all')">Todas</button>
  <button onclick="filter('vn')">Visual novels</button>
  <button onclick="filter('games')">Jogos</button>
  <button onclick="filter('anime')">Anime</button>
  <button onclick="filter('art')">Referências</button>
</nav>

<main class="gallery" id="gallery">
  <div class="item" data-category="vn">
    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=700&q=80" alt="Referência visual">
  </div>
  <div class="item" data-category="games">
    <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=700&q=80" alt="Jogos">
  </div>
  <div class="item" data-category="art">
    <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=700&q=80" alt="Referência estética">
  </div>
  <div class="item" data-category="anime">
    <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=700&q=80" alt="Arte ilustrada">
  </div>
</main>

<div id="viewer" onclick="closeViewer()">
  <button id="close" aria-label="Fechar">&times;</button>
  <img id="large" alt="Imagem ampliada">
</div>

<footer>ARCHIVE. — Digital visual collection</footer>

<script>
function filter(category) {
  document.querySelectorAll('.item').forEach(item => {
    item.style.display =
      category === 'all' ||
      item.dataset.category === category
      ? '' : 'none';
  });
}

document.querySelectorAll('.item img').forEach(img => {
  img.onclick = () => {
    document.getElementById('large').src = img.src;
    document.getElementById('viewer').style.display = 'flex';
  };
});

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
}
</script>
</body>
</html>
